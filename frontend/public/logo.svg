<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0044FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Chrome Left Facet Gradient -->
    <linearGradient id="chrome-left-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Chrome Left Shadow Gradient -->
    <linearGradient id="chrome-left-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="40%" stop-color="#64748B"/>
      <stop offset="85%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Chrome Right Facet Gradient -->
    <linearGradient id="chrome-right-facet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F1F5F9"/>
      <stop offset="65%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Chrome Right Shadow Gradient -->
    <linearGradient id="chrome-right-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Orbital Ring Glowing Cyan Gradient -->
    <linearGradient id="orbit-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00B4D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0077B6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="orbit-core" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Central Radiant Spark Gradient -->
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-glow)" />

  <!-- Outer Celestial Compass Reticle -->
  <circle cx="256" cy="256" r="215" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2 6" />
  <circle cx="256" cy="256" r="200" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1" />
  <circle cx="256" cy="256" r="185" stroke="#0284C7" stroke-opacity="0.2" stroke-width="0.75" />

  <!-- Compass Cardinal Line Ticks -->
  <line x1="256" y1="28" x2="256" y2="88" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="256" y1="424" x2="256" y2="484" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="28" y1="256" x2="88" y2="256" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="424" y1="256" x2="484" y2="256" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Compass Cardinal Pips -->
  <circle cx="256" cy="40" r="3.5" fill="#FFFFFF" filter="url(#cyan-glow)"/>
  <circle cx="256" cy="472" r="3.5" fill="#FFFFFF" filter="url(#cyan-glow)"/>
  <circle cx="40" cy="256" r="3.5" fill="#FFFFFF" filter="url(#cyan-glow)"/>
  <circle cx="472" cy="256" r="3.5" fill="#FFFFFF" filter="url(#cyan-glow)"/>

  <!-- Back Half of Orbital Ring (passes behind the A) -->
  <path d="M 126 312 C 100 240, 180 160, 310 135 C 370 123, 415 140, 420 168 C 424 190, 400 216, 360 240"
        stroke="#00D2FF" stroke-width="5" stroke-opacity="0.4" fill="none" filter="url(#cyan-glow)"/>

  <!-- MAIN EMBLEM: THE ASCEND "A" -->
  <!-- Left Leg - Outer Specular Bevel -->
  <path d="M 256 82 L 256 215 L 142 360 L 112 342 Z"
        fill="url(#chrome-left-facet)" />

  <!-- Left Leg - Inner Shaded Facet -->
  <path d="M 256 215 L 256 82 L 180 286 L 214 286 Z"
        fill="url(#chrome-left-dark)" />

  <!-- Left Leg - Lower Cutout Edge -->
  <path d="M 142 360 L 178 376 L 195 316 L 160 316 Z"
        fill="url(#chrome-left-facet)" opacity="0.9"/>

  <!-- Right Leg - Outer Specular Bevel -->
  <path d="M 256 82 L 400 342 L 370 360 L 256 215 Z"
        fill="url(#chrome-right-facet)" />

  <!-- Right Leg - Inner Shaded Facet -->
  <path d="M 256 82 L 256 215 L 298 286 L 332 286 Z"
        fill="url(#chrome-right-dark)" />

  <!-- Right Leg - Lower Cutout Edge -->
  <path d="M 370 360 L 334 376 L 317 316 L 352 316 Z"
        fill="url(#chrome-right-dark)" opacity="0.9"/>

  <!-- Center Triangular Cutout Void / Contrast Bridge -->
  <polygon points="256,182 222,274 290,274" fill="#06080D" />

  <!-- Chrome Crest Spine Ridge Highlight -->
  <line x1="256" y1="82" x2="256" y2="215" stroke="#FFFFFF" stroke-width="2" opacity="0.95" />
  <line x1="256" y1="82" x2="142" y2="360" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
  <line x1="256" y1="82" x2="370" y2="360" stroke="#E2E8F0" stroke-width="1.2" opacity="0.8" />

  <!-- Front Dynamic Sweeping Planetary Orbital Ring (passes over the front of the A) -->
  <!-- Outer Glow Pass -->
  <path d="M 104 316 C 100 338, 120 354, 162 358 C 224 364, 312 334, 386 270 C 440 222, 470 166, 452 144 C 442 132, 420 130, 388 136 C 352 143, 310 158, 272 180 C 230 204, 178 242, 136 280 C 114 300, 106 310, 104 316 Z"
        fill="url(#orbit-cyan)" filter="url(#intense-glow)" opacity="0.75" />

  <!-- Solid Crisp Blade Pass -->
  <path d="M 108 314 C 112 298, 140 268, 184 232 C 232 192, 304 150, 372 138 C 418 130, 442 140, 436 158 C 430 178, 396 216, 344 256 C 284 302, 212 342, 156 344 C 126 345, 106 332, 108 314 Z"
        fill="url(#orbit-core)" />

  <!-- Brilliant White Inner Energy Streak -->
  <path d="M 124 310 C 160 270, 230 216, 310 174 C 362 146, 412 138, 426 148 C 434 154, 422 174, 392 204 C 336 260, 240 318, 174 326 C 146 330, 130 322, 124 310 Z"
        fill="#FFFFFF" opacity="0.9" />

  <!-- Radiant Nexus 4-Point Star (The Core Spark of ASCEND) -->
  <g filter="url(#intense-glow)">
    <!-- Cyan Ambient Halo -->
    <circle cx="256" cy="208" r="32" fill="url(#spark-glow)" />

    <!-- Vertical Diamond Spike -->
    <path d="M 256 150 Q 256 208, 251 208 Q 256 208, 256 266 Q 256 208, 261 208 Q 256 208, 256 150 Z"
          fill="#FFFFFF" />

    <!-- Horizontal Diamond Spike -->
    <path d="M 210 208 Q 256 208, 256 204 Q 256 208, 302 208 Q 256 208, 256 212 Q 256 208, 210 208 Z"
          fill="#FFFFFF" />

    <!-- Pure White Central Core Core -->
    <circle cx="256" cy="208" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
